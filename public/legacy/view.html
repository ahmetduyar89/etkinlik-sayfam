<!doctype html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Görüntüleyici</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1e293b;
        }

        #activity-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .error-message {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 2rem;
        }

        .error-content {
            max-width: 400px;
            padding: 2rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .loader {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="activity-container">
        <div class="loader">
            <p>Etkinlik yükleniyor...</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDn8WWA2et22ZqtSEf3oUsoxZZo7Mu8LtU",
            authDomain: "interaktif-etkinliklerim.firebaseapp.com",
            projectId: "interaktif-etkinliklerim",
            storageBucket: "interaktif-etkinliklerim.firebasestorage.app",
            messagingSenderId: "701319349005",
            appId: "1:701319349005:web:5eef690a8ec9bb3ed92644"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        db.settings({ experimentalForceLongPolling: true });

        async function loadActivity() {
            const params = new URLSearchParams(window.location.search);
            const activityId = params.get('id');
            const container = document.getElementById('activity-container');

            if (!activityId) {
                showError("Hata: Görüntülenecek etkinlik ID'si bulunamadı.");
                return;
            }

            try {
                const docRef = db.collection("activities").doc(activityId);
                const docSnap = await docRef.get();

                if (docSnap.exists) {
                    const activity = docSnap.data();
                    document.title = activity.title || "Etkinlik Görüntüleyici";

                    const iframe = document.createElement('iframe');
                    iframe.srcdoc = activity.html_code;

                    container.innerHTML = '';
                    container.appendChild(iframe);
                } else {
                    showError("Hata: Bu ID'ye sahip bir etkinlik bulunamadı.");
                }
            } catch (error) {
                console.error("Etkinlik yüklenirken hata oluştu:", error);
                showError("Bir hata oluştu. Lütfen bağlantıyı kontrol edin veya daha sonra tekrar deneyin.");
            }
        }

        function showError(message) {
            const container = document.getElementById('activity-container');
            container.innerHTML = `
                <div class="error-message">
                    <div class="error-content">
                        <p>${message}</p>
                    </div>
                </div>
            `;
        }

        loadActivity();
    </script>
</body>

</html>
