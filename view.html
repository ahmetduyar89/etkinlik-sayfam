<!doctype html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Görüntüleyici</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
            background-color: #f0f2f5;
        }

        /* YENİ EKLENEN KURAL: Bu kural konteynerin tam ekran olmasını sağlar. */
        #activity-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .message {
            font-size: 1.5em;
            color: #555;
        }
    </style>
</head>
<body>
    <div id="activity-container">
        <p class="message">Etkinlik yükleniyor...</p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>
        // ***** BURAYI index.html'deki AYNI BİLGİLERLE DOLDURUN *****
        const firebaseConfig = {
          apiKey: "AIzaSyDn8WWA2et22ZqtSEf3oUsoxZZo7Mu8LtU",
          authDomain: "interaktif-etkinliklerim.firebaseapp.com",
          projectId: "interaktif-etkinliklerim",
          storageBucket: "interaktif-etkinliklerim.firebasestorage.app",
          messagingSenderId: "701319349005",
          appId: "1:701319349005:web:5eef690a8ec9bb3ed92644"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function loadActivity() {
            const params = new URLSearchParams(window.location.search);
            const activityId = params.get('id');
            const container = document.getElementById('activity-container');

            if (!activityId) {
                container.innerHTML = '<p class="message">Hata: Görüntülenecek etkinlik ID\'si bulunamadı.</p>';
                return;
            }

            try {
                const docRef = db.collection("activities").doc(activityId);
                const docSnap = await docRef.get();

                if (docSnap.exists) {
                    const activity = docSnap.data();
                    document.title = activity.title;
                    // Konteynerin içeriğini iframe ile değiştirirken artık tam ekran olacaktır.
                    container.innerHTML = `<iframe srcdoc="${activity.html_code.replace(/"/g, '&quot;')}"></iframe>`;
                } else {
                    container.innerHTML = '<p class="message">Hata: Bu ID\'ye sahip bir etkinlik bulunamadı.</p>';
                }
            } catch (error) {
                console.error("Etkinlik yüklenirken hata oluştu:", error);
                container.innerHTML = '<p class="message">Bir hata oluştu. Lütfen daha sonra tekrar deneyin.</p>';
            }
        }

        loadActivity();
    </script>
</body>
</html>
