name: Kontroller

# Yayını Netlify yapıyor (netlify.toml): main'e gelen her push'u kendisi
# görür, derler ve yayınlar. Bu iş akışı yayınlamaz — yalnızca değişikliğin
# derlenip derlenmediğini ve tip hatası olup olmadığını söyler.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kontroller-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Build
        run: npm run build
